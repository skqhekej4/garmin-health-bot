name: garmin auth test (one-off)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 비밀 파일 복원
        run: printf '%s' "${{ secrets.ENV_B64 }}" | base64 -d > .env
      - name: install garminconnect + curl_cffi
        run: pip install "garminconnect==0.3.6" curl_cffi python-dotenv
      - name: run auth test
        run: python test_auth.py
