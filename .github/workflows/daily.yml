name: 가민 건강봇 (아침/점심 문진→브리핑)

on:
  schedule:
    - cron: '50 23 * * *'   # 08:50 KST — 아침 세션 시작 (~10시까지 듣기)
    - cron: '30 2 * * *'    # 11:30 KST — 점심 세션 시작 (~13시까지 듣기)
  workflow_dispatch:
    inputs:
      mode:
        description: '수동 실행 모드(테스트, 대기 20분)'
        default: 'morning'
        type: choice
        options: ['morning', 'lunch']

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100      # 점심 세션 최대 ~90분 + 여유
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 비밀 파일 복원
        run: |
          printf '%s' "${{ secrets.ENV_B64 }}" | base64 -d > .env
          printf '%s' "${{ secrets.SERVICE_ACCOUNT_B64 }}" | base64 -d > service_account.json
          printf '%s' "${{ secrets.GARTH_RYU_B64 }}" | base64 -d | tar -xz
          printf '%s' "${{ secrets.GARTH_EK_B64 }}" | base64 -d | tar -xz
      - name: 모드/대기시간 결정 후 실행
        run: |
          SCHED="${{ github.event.schedule }}"
          MODE="${{ github.event.inputs.mode }}"
          if [ -n "$MODE" ]; then
            RUN_MODE="$MODE"; BUDGET=20
          elif [ "$SCHED" = "30 2 * * *" ]; then
            RUN_MODE="lunch"; BUDGET=90
          else
            RUN_MODE="morning"; BUDGET=70
          fi
          echo "▶ 모드: $RUN_MODE / 대기: ${BUDGET}분"
          Q_BUDGET_MIN=$BUDGET python cloud_run.py "$RUN_MODE"
