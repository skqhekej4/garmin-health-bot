name: 가민 건강봇 (아침 문진→브리핑)

on:
  schedule:
    - cron: '40 23 * * *'   # 08:40 KST — 문진 시작 (대화형, 답하면 브리핑)
  workflow_dispatch: {}      # 수동 실행 버튼 (테스트용)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60       # 대화형: 답할 때까지(최대 예산) 살아있음
    env:
      TZ: Asia/Seoul
      Q_BUDGET_MIN: '25'      # 사용자당 최대 대기(분). 초과 시 그 사람은 건너뜀
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 비밀 파일 복원
        run: |
          printf '%s' "${{ secrets.ENV_B64 }}" | base64 -d > .env
          printf '%s' "${{ secrets.SERVICE_ACCOUNT_B64 }}" | base64 -d > service_account.json
          printf '%s' "${{ secrets.GARTH_RYU_B64 }}" | base64 -d | tar -xz
          printf '%s' "${{ secrets.GARTH_EK_B64 }}" | base64 -d | tar -xz
      - name: 아침 문진→브리핑 실행
        run: python cloud_run.py
